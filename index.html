<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" type="image/x-icon" href="images/favicon.png">
        <link rel="stylesheet" href="styles.css">
        <script defer src="index.js"></script>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Short+Stack&display=swap" rel="stylesheet">

        <title>prim cable car</title>
    </head>

    <body>
  <script>
    document.body.style.visibility = 'hidden';
  </script>

        <audio id="music" loop src="audio/music.mp3"></audio>
        <script>
            const audio = document.getElementById("music");
            document.addEventListener("click", () => {
                audio.play();
            }, {once: true});
        </script>

        <div class="navbar">
            <button onclick="document.location='https://github.com/regulardennis/primcablecar/graphs/contributors?all=1'">lovely people who made this</button>
            <button onclick="document.location='rights.html'">rights</button>
            <button onclick="document.location='art.html'">art</button>
        </div>

        <div class="centre">
            <img src="images/image.png" onclick="onClick()" class="no-select-drag">
      
            <h1 id="points">prim points: 0</h1>
            <button onclick="onReset()">reset</button>
        </div>
        
        <div id="shop"></div>

        <div class="footer">
            <p>music by bensound.com</p>
        </div>
  <script>
    setTimeout(() => {
      document.body.style.visibility = 'visible';
    }, 50000);
  </script>
    </body>
</html>
