<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" type="image/x-icon" href="images/favicon.png">
        <link rel="stylesheet" href="styles.css">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Short+Stack&display=swap" rel="stylesheet">

        <title>rights</title>
    </head>

    <body>
        <audio id="music" loop src="audio/rights_music.mp3"></audio>
        <script>
            const audio = document.getElementById("music");
            document.addEventListener("click", () => {
                setTimeout(() => {
                    audio.play();
                }, 1000);
            }, {once: true});
        </script>

        <div class="navbar">
            <button onclick="document.location='https://github.com/regulardennis/primcablecar'">github</button>
            <button onclick="document.location='index.html'">cable car</button>
        </div>

        <div class="centre">
            <img src="images/rights.png" class="no-select-drag">
        </div>

        <div class="footer">
            <p>click anywhere for lovely corporate music from pixabay.com</p>
        </div>
    </body>
</html>
