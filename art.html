<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="images/favicon.png">
    <link rel="stylesheet" href="styles.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Short+Stack&display=swap" rel="stylesheet">

    <title>prim cable car - art</title>
</head>
<body>
    <audio id="music" loop src="audio/art_music.mp3"></audio>
    <script>
            const audio = document.getElementById("music");
            document.addEventListener("click", () => {
                setTimeout(() => {
                    audio.play();
                }, 1000);
            }, {once: true});
    </script>

    <div class="navbar">
        <button onclick="document.location='https://github.com/regulardennis/primcablecar'">github</button>
        <button onclick="document.location='index.html'">cable car</button>
    </div>

    <div class="centre masonry-gallery">
        <div class="gallery-item">
            <img src="images/art/01.png">
            <p>made by @silo19_ on discord</p>
        </div>

        <div class="gallery-item">
            <img src="images/art/02.jpg">
            <p>made by @luckyvincent831 on discord</p>
        </div>

        <div class="gallery-item">
            <img src="images/art/03.png">
            <p>made by @kitnx on discord</p>
        </div>

        <div class="gallery-item">
            <img src="images/art/04.png">
            <p>made by @samica_alguem on discord</p>
        </div>

        <div class="gallery-item">
            <img src="images/art/05.png">
            <p>made by @shivlow on discord</p>
        </div>

        <div class="gallery-item">
            <img src="images/art/06.png">
            <p>made by my 5 year old sister</p>
        </div>

        <div class="gallery-item">
            <img src="images/art/07.jpg">
            <p>made by @quert_gb</p>
        </div>

        <div class="gallery-item">
            <img src="images/art/08.png">
            <p>made by @velciyr on discord</p>
        </div>
    </div>

    <div class="footer">
            <p>click anywhere for music from pixabay.com</p>
    </div>
</body>
</html>
